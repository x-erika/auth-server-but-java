quarkus.datasource.db-kind=postgresql

quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASS}
quarkus.datasource.jdbc.url=${DB_URL}

%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASS:erika}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:15552/xerika-java?sslmode=disable}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.hibernate-orm.database.generation=none

quarkus.redis.hosts=redis://${REDIS_HOST}:${REDIS_PORT}
quarkus.redis.password=${REDIS_PASS}
%dev.quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
%dev.quarkus.redis.password=${REDIS_PASS:xerika}

auth.redis.authcode.ttl-seconds=600
auth.redis.device-auth.ttl-seconds=900
auth.redis.pending-auth.ttl-seconds=600
auth.redis.client-cache.ttl-seconds=1800

auth.ratelimit.login.email.max-attempts=5
auth.ratelimit.login.email.window-seconds=900
auth.ratelimit.login.ip.max-attempts=20
auth.ratelimit.login.ip.window-seconds=900
auth.ratelimit.signup.ip.max-attempts=3
auth.ratelimit.signup.ip.window-seconds=3600
auth.ratelimit.verify-email.ip.max-attempts=10
auth.ratelimit.verify-email.ip.window-seconds=60
auth.ratelimit.device-auth.client.max-attempts=10
auth.ratelimit.device-auth.client.window-seconds=60

auth.issuer.url=http://localhost:8080
auth.jwt.access-token-ttl-seconds=900
auth.jwt.id-token-ttl-seconds=3600

smallrye.jwt.sign.relax-key-validation=true

# session_token / csrf_token cookies: Secure flag off in dev (so plain HTTP works),
# on in prod profile (so browser only sends them over HTTPS).
auth.cookie.secure=false
%prod.auth.cookie.secure=true

# Proxy / X-Forwarded-* trust.
#
# Application code reads the client IP via request.remoteAddress() (see
# common/web/ClientIp.java). Whether that value reflects the X-Forwarded-For
# chain or the raw TCP peer is decided HERE, not in the resource methods, so
# the trust boundary lives in one place.
#
# Defaults are off: a client that hits the server directly (no LB / reverse
# proxy in front) cannot spoof its source IP by sending its own XFF header.
#
# To turn on in prod, set BOTH env vars:
#   AUTH_TRUST_FORWARDED=true
#   AUTH_TRUSTED_PROXIES=10.0.0.0/8        (or your LB CIDR — comma-separated)
#
# Setting AUTH_TRUST_FORWARDED=true without AUTH_TRUSTED_PROXIES means every
# peer is treated as a trusted proxy, which re-introduces the spoofing
# bypass. Keep both wired together.
quarkus.http.proxy.proxy-address-forwarding=${AUTH_TRUST_FORWARDED:false}
quarkus.http.proxy.allow-x-forwarded=${AUTH_TRUST_FORWARDED:false}
quarkus.http.proxy.enable-forwarded-host=${AUTH_TRUST_FORWARDED:false}
quarkus.http.proxy.trusted-proxies=${AUTH_TRUSTED_PROXIES:}

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.system=true

# CORS — enabled in dev for the admin FE + sample web-app client. Credentials
# allowed so the session_token cookie set by /auth/login can be returned and
# forwarded on subsequent /oauth/authorize navigations.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Authorization,Content-Type,X-Session-Token,X-Forwarded-For
quarkus.http.cors.access-control-allow-credentials=true