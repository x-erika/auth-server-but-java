quarkus.datasource.db-kind=postgresql

quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASS}
quarkus.datasource.jdbc.url=${DB_URL}

%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASS:erika}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:15552/xerika-java?sslmode=disable}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.hibernate-orm.database.generation=none

quarkus.redis.hosts=redis://${REDIS_HOST}:${REDIS_PORT}
quarkus.redis.password=${REDIS_PASS}
%dev.quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
%dev.quarkus.redis.password=${REDIS_PASS:xerika}

auth.redis.authcode.ttl-seconds=600
auth.redis.device-auth.ttl-seconds=900
auth.redis.pending-auth.ttl-seconds=600
auth.redis.client-cache.ttl-seconds=1800

auth.ratelimit.login.email.max-attempts=5
auth.ratelimit.login.email.window-seconds=900
auth.ratelimit.login.ip.max-attempts=20
auth.ratelimit.login.ip.window-seconds=900
auth.ratelimit.signup.ip.max-attempts=3
auth.ratelimit.signup.ip.window-seconds=3600
auth.ratelimit.verify-email.ip.max-attempts=10
auth.ratelimit.verify-email.ip.window-seconds=60
auth.ratelimit.device-auth.client.max-attempts=10
auth.ratelimit.device-auth.client.window-seconds=60

auth.issuer.url=http://localhost:8080
auth.jwt.access-token-ttl-seconds=900
auth.jwt.id-token-ttl-seconds=3600

smallrye.jwt.sign.relax-key-validation=true

# session_token / csrf_token cookies: Secure flag off in dev (so plain HTTP works),
# on in prod profile (so browser only sends them over HTTPS).
auth.cookie.secure=false
%prod.auth.cookie.secure=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.system=true